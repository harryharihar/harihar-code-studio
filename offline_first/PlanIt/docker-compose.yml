services:
  postgres:
    image: postgres:18
    container_name: planit-postgres
    environment:
      POSTGRES_DB: planit
      POSTGRES_USER: planit
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - planit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planit -d planit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planit-postgres-data: